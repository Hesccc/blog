name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push to Multi-Registries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. 登录 Docker Hub 镜像中心
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      # 2. 登录阿里云容器镜像服务 (ACR)
      - name: Log in to Aliyun ACR
        if: github.event_name != 'pull_request' && env.ALIYUN_USERNAME != '' && env.ALIYUN_NAMESPACE != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY || 'registry.cn-shenzhen.aliyuncs.com' }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        env:
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}

      # 3. 动态计算目标镜像仓库列表（自动支持双平台同时推送）
      - name: Prepare target registries
        id: prep
        run: |
          IMAGES="${{ secrets.DOCKERHUB_USERNAME }}/aeronote"
          if [ -n "${{ secrets.ALIYUN_ACR_USERNAME }}" ] && [ -n "${{ secrets.ALIYUN_ACR_NAMESPACE }}" ]; then
            REGISTRY="${{ secrets.ALIYUN_ACR_REGISTRY }}"
            if [ -z "$REGISTRY" ]; then
              REGISTRY="registry.cn-shenzhen.aliyuncs.com"
            fi
            IMAGES="$IMAGES
          $REGISTRY/${{ secrets.ALIYUN_ACR_NAMESPACE }}/aeronote"
          fi
          echo "images<<EOF" >> $GITHUB_OUTPUT
          echo "$IMAGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 4. 自动提取镜像元数据与标签 (latest, branch, sha, semver)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.images }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # 5. 一次编译构建，同时推送到 Docker Hub 与 阿里云 ACR
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=aeronote
          cache-to: type=gha,mode=max,scope=aeronote
